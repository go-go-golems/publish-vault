services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_VAULT_NAME=${VAULT_NAME:-My Vault}
    ports:
      - "8080:8080"
      # Metrics stay loopback-only on the host; Grafana/Prometheus can also
      # scrape app:9091 from the Compose network without public exposure.
      - "127.0.0.1:${METRICS_PORT:-9091}:9091"
    volumes:
      - ${VAULT_PATH:-./vault-example}:/vault:ro
      # Disk for the search index. Keeping it out of the Go heap is the single
      # largest memory saving available to this service: for a 1712-note vault
      # an in-memory bleve index is 884 MiB, 84% of the live heap. A named
      # volume (disk-backed) is required — a tmpfs would be charged to the same
      # memory budget and change nothing. See PV-MEMORY-019.
      - search-index:/var/lib/publish-vault
    environment:
      - VAULT_DIR=/vault
    command:
      - "serve"
      - "--port"
      - "8080"
      - "--serve-web"
      - "--search-index-path"
      - "/var/lib/publish-vault/search"
      - "--metrics-addr"
      - ":9091"
      - "--metrics-environment"
      - "local"
      - "--vault-name"
      - "${VAULT_NAME:-My Vault}"
      - "--page-title"
      - "${PAGE_TITLE:-My Vault}"
      - "--ssr-url"
      - "http://ssr:8089"
    restart: unless-stopped
    depends_on:
      - ssr

  ssr:
    build:
      context: .
      dockerfile: web/ssr.Dockerfile
    environment:
      - SSR_PORT=8089
      - API_BASE=http://app:8080
      - BASE_URL=${BASE_URL:-http://localhost:8080}
    restart: unless-stopped

volumes:
  search-index:
