---
# This file contains the configuration for golangci-lint.
# See https://golangci-lint.run/usage/configuration/ for reference.

version: "2"

linters:
  default: none
  enable:
    # defaults
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # additional linters
    - exhaustive
    - nonamedreturns
    - predeclared
  exclusions:
    # ttmp/ is this project's scratch space for investigation scripts and
    # debugging harnesses (see AGENT.md). Those are throwaway programs written
    # to answer one question, not shipped code, and holding them to the
    # production lint rules only produces noise that blocks unrelated PRs.
    paths:
      - ttmp/
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: cli.CreateProcessorLegacy'
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - ttmp/
